server:
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/book_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:book_agent}
    password: ${DB_PASSWORD:book_agent123}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  public-url: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123456}
  bucket: ${MINIO_BUCKET:book-agent}
sa-token:
  token-name: Authorization
  is-read-cookie: false
  timeout: 259200

book-agent:
  internal-token: ${INTERNAL_TOKEN:}
  ai-url: ${AI_URL:http://127.0.0.1:8100}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123} # development defaults; override when deployed
