[project]
name = "book-agent-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "llama-index-core>=0.12,<0.15",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "numpy>=1.26,<3",
  "fastembed>=0.7,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "beautifulsoup4>=4.13,<5",
  "reportlab>=4.4,<5",
  "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
